name: CI — API de e-mail

# Roda só quando a API de e-mail muda (é a única parte do repo com testes).
on:
  push:
    paths: ["api/email/**"]
  pull_request:
    paths: ["api/email/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3"]
    name: PHP ${{ matrix.php }}
    defaults:
      run:
        working-directory: api/email
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: phpunit:11
          coverage: none

      # Sem `composer install`: não há dependência de runtime (renderer é local).
      # O phpunit vem do setup-php; nenhum secret é necessário.
      - name: Lint
        run: |
          for f in $(find . -name '*.php' -not -path './vendor/*'); do php -l "$f"; done

      - name: Test
        run: phpunit
